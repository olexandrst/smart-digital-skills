# UAT-сценарії персон AI Knowledge Hub (AKH-19, готує ґрунт для BR-17).
#
# Файл ДАНИХ: щоб додати сценарій, допишіть запис — код тестів чіпати не треба.
# Запускає їх tests/test_uat.py, який на кожному сценарії перевіряє, що
# потрібний матеріал знаходиться щонайбільше за `max_clicks` кліків.
#
# Поля запису:
#   persona     — категорія користувача з BRD
#   goal        — що людина хоче зробити
#   query       — як вона це формулює в пошуку (шлях «пошук»)
#   path        — навігація замість пошуку: section / folder / kind (шлях «кліки»)
#   expect      — назва матеріалу, який має знайтися
#   max_clicks  — стеля кліків від головної (типово 2)
#
# Про дві клацання. Ціль BRD — матеріал не далі ніж за два кліки. Її виконують
# обидва основні шляхи: пошук (ввести запит → відкрити картку) і навігація
# «розділ → картка». Колекція — ДОДАТКОВЕ звуження всередині розділу, тож
# повний шлях «розділ → колекція → картка» має три рівні за визначенням.
# Такі сценарії позначені max_clicks: 3 — це властивість ієрархії, а не збій.
#
# Сценарії розраховані на каталог, наповнений `python -m scripts.seed`.

scenarios:
  # ---------------------------------------------------------------- 1
  - persona: Новачок в AI
    goal: Зрозуміти, з чого почати роботу з моделями
    query: як почати працювати з ші
    expect: Як писати ефективні промпти
    max_clicks: 2

  - persona: Новачок в AI
    goal: Навчитися формулювати завдання моделі
    query: як правильно ставити завдання моделі
    expect: Як писати ефективні промпти

  # ---------------------------------------------------------------- 2
  - persona: Новачок у компанії
    goal: Знайти внутрішні ресурси й регламенти
    query: де знайти регламенти компанії
    expect: Портал знань Metinvest Digital

  - persona: Новачок у компанії
    goal: Дізнатися про спільноту та заходи
    path: {section: AI Community}
    expect: "AI Coffee: як приєднатися та що це дає"

  # ---------------------------------------------------------------- 3
  - persona: Бізнес-користувач
    goal: Швидше опрацьовувати тендерну документацію
    query: як швидше обробляти документи
    expect: Аналіз тендерної документації

  - persona: Бізнес-користувач
    goal: Отримати протокол після наради
    query: потрібен протокол наради
    expect: Протокол наради за стенограмою

  # ---------------------------------------------------------------- 4
  - persona: Досвідчений користувач
    goal: Знайти готовий кейс для повторення
    query: автоматизація обробки заявок
    expect: "Кейс: автоматизація обробки заявок у HR"

  - persona: Досвідчений користувач
    goal: Переглянути всі кейси компанії
    path: {kind: case}
    expect: "Кейс: автоматизація обробки заявок у HR"

  # ---------------------------------------------------------------- 5
  - persona: Розробник агентів (початковий рівень)
    goal: Подивитися готового агента як приклад
    path: {section: Toolbox, folder: Created Agents}
    expect: Асистент технічної підтримки
    max_clicks: 3

  - persona: Розробник агентів (початковий рівень)
    goal: Знайти агента під виробничі показники
    query: показники виробництва
    expect: Агент аналітики виробництва

  # ---------------------------------------------------------------- 6
  - persona: Розробник агентів (просунутий рівень)
    goal: Підключити корпоративну базу знань до свого клієнта
    query: підключити mcp сервер
    expect: "MCP: Корпоративна база знань"

  - persona: Розробник агентів (просунутий рівень)
    goal: Знайти публічний MCP-сервер
    path: {kind: mcp}
    expect: "MCP: GitHub"

  # ---------------------------------------------------------------- 7
  - persona: Власник бізнес-процесу
    goal: Оцінити, що дає автоматизація звернень
    query: скоротити час обробки звернень
    expect: "Кейс: автоматизація обробки заявок у HR"

  - persona: Власник бізнес-процесу
    goal: Отримати доступ до моделі для пілота
    query: заявка на доступ до моделі
    expect: Заявка на доступ до моделі

  # ---------------------------------------------------------------- 8
  - persona: AI Partner
    goal: Знайти матеріали для навчання колег
    path: {section: Learning Space}
    expect: Як писати ефективні промпти

  - persona: AI Partner
    goal: Показати колегам зовнішні відкриті моделі
    query: hugging face
    expect: Hugging Face

  # ---------------------------------------------------------------- 9
  - persona: Власник контенту
    goal: Перевірити правила роботи з конфіденційними даними
    query: конфіденційні дані в моделях
    expect: Робота з конфіденційними даними в ШІ

  - persona: Власник контенту
    goal: Переглянути власні інструкції
    path: {kind: instruction}
    expect: Робота з конфіденційними даними в ШІ

  # --------------------------------------------------------------- 10
  - persona: Менеджер бази знань
    goal: Знайти правила ведення каталогу
    path: {section: Learning Space, folder: Cataloging Knowledge}
    expect: null            # колекція порожня — перевіряємо саме доступність шляху
    allow_empty: true
    max_clicks: 3

  - persona: Менеджер бази знань
    goal: Переглянути наповнення розділу Toolbox
    path: {section: Toolbox}
    expect: Агент аналітики виробництва

  # --------------------------------------------------------------- 11
  - persona: Власник продукту
    goal: Побачити впроваджені AI-рішення
    path: {section: Toolbox, folder: AI Solutions}
    expect: "MCP: Корпоративна база знань"
    max_clicks: 3

  - persona: Власник продукту
    goal: Знайти шаблони й перевірені промпти
    path: {section: Insight Center, folder: "Templates & Prompts"}
    expect: Аналіз тендерної документації
    max_clicks: 3
