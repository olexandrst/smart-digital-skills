<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart-ProfiHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Екран входу -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <h1>Smart-ProfiHub</h1>
      <p class="subtitle">Корпоративна AI-платформа</p>
      <input type="text" id="login-username" placeholder="Логін" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password" required>
      <button type="submit">Увійти</button>
      <div id="login-error" class="error"></div>
      <div class="hint">Демо: admin / Admin123!</div>
    </form>
  </div>

  <!-- Головний застосунок -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">Smart-ProfiHub</div>
      <nav id="nav" class="nav"></nav>
      <div class="user-box">
        <span id="user-name"></span>
        <span id="user-roles" class="roles"></span>
        <button id="logout-btn" class="ghost">Вийти</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
