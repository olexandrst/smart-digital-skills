<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Knowledge Hub</title>
  <link rel="stylesheet" href="style.css?v=59">
</head>
<body>
  <!-- Екран входу -->
  <div id="login-screen" class="auth">
    <div class="auth-left">
      <div class="auth-brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff5a63"/>
              <stop offset="1" stop-color="#e30613"/>
            </linearGradient>
          </defs>
          <path d="M30 8c-6 0-9 4-11 8-2 4-4 8-9 8a7 7 0 0 1 0-14c3 0 5 1 7 3"
                fill="none" stroke="url(#bg)" stroke-width="5" stroke-linecap="round"/>
          <path d="M18 40c6 0 9-4 11-8 2-4 4-8 9-8a7 7 0 0 1 0 14c-3 0-5-1-7-3"
                fill="none" stroke="url(#bg)" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">AI Knowledge Hub</span>
      </div>

      <h1 class="auth-headline">
        Прискорюйте роботу.<br>
        <span class="grad">Автоматизуйте більше.</span>
      </h1>
      <p class="auth-sub">
        Ваш AI-простір для спілкування з провідними моделями,<br>
        керування токенами та доступу до бази AI-знань компанії.
      </p>

      <form id="login-form" class="login-card">
        <h2>З поверненням</h2>
        <p class="card-sub">Увійдіть до свого робочого простору</p>

        <a id="entra-btn" class="btn-entra hidden" href="/api/auth/entra/start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8.5v8.5H3V3Zm9.5 0H21v8.5h-8.5V3ZM3 12.5h8.5V21H3v-8.5Zm9.5 0H21V21h-8.5v-8.5Z"/></svg>
          Увійти через корпоративний акаунт
        </a>
        <div id="login-or" class="login-or hidden"><span>або</span></div>

        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5Z"/>
          </svg>
          <input type="text" id="login-username" placeholder="Email або логін"
                 autocomplete="username" required>
        </div>

        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 0 1 6 0v3H9Z"/>
          </svg>
          <input type="password" id="login-password" placeholder="Пароль"
                 autocomplete="current-password" required>
          <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Показати пароль">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5c-5 0-9 4-10 7 1 3 5 7 10 7s9-4 10-7c-1-3-5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-primary">Увійти</button>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </div>

  <!-- Головний застосунок.
       Каркас: суцільна верхня панель (бренд · режим · пошук · профіль),
       під нею — бічна панель, що належить поточному режиму, і контент.
       Бічна панель тримає каталог, а не список екранів застосунку. -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff5a63"/>
              <stop offset="1" stop-color="#e30613"/>
            </linearGradient>
          </defs>
          <path d="M30 8c-6 0-9 4-11 8-2 4-4 8-9 8a7 7 0 0 1 0-14c3 0 5 1 7 3"
                fill="none" stroke="url(#bg2)" stroke-width="5" stroke-linecap="round"/>
          <path d="M18 40c6 0 9-4 11-8 2-4 4-8 9-8a7 7 0 0 1 0 14c-3 0-5-1-7-3"
                fill="none" stroke="url(#bg2)" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">AI Knowledge Hub</span>
        <button id="side-toggle" class="side-toggle" type="button"
                aria-label="Показати або сховати бічну панель">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17v13h-17zM9.5 5.5v13"/></svg>
        </button>
      </div>

      <div class="mode-seg" id="mode-seg"></div>

      <button id="new-chat-btn" class="btn-newchat hidden" title="Новий чат">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        Новий чат
      </button>

      <div class="spotlight">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.3"/><path d="m15.6 15.6 4.4 4.4"/></svg>
        <input id="global-q" type="text" autocomplete="off"
               placeholder="Пошук або опишіть задачу своїми словами">
      </div>

      <div class="me-wrap">
        <button id="me-btn" class="me-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="user-avatar"></span>
          <svg class="me-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <!-- Особисте й службове — тут, а не в постійному списку зліва -->
        <div id="me-menu" class="me-menu hidden" role="menu">
          <div class="me-who">
            <b id="user-name"></b>
            <span id="user-roles" class="roles"></span>
          </div>
          <div class="me-sep"></div>
          <button class="me-item" data-go="hub:files" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.2c0-1 .8-1.8 1.8-1.8h3.4l1.8 2.2h8.2c1 0 1.8.8 1.8 1.8v8.4c0 1-.8 1.8-1.8 1.8H5.3c-1 0-1.8-.8-1.8-1.8V7.2Z"/></svg>
            Мої файли
          </button>
          <button class="me-item" data-go="hub:fav" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8L12 3.6Z"/></svg>
            Обране<span class="me-right" id="me-fav-count"></span>
          </button>
          <button class="me-item" data-act="my-ideas" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 18.2h4.8M10.6 21h2.8M12 3.2a6.2 6.2 0 0 1 3.6 11.2v1.4H8.4v-1.4A6.2 6.2 0 0 1 12 3.2Z"/></svg>
            Мої ідеї
          </button>
          <button class="me-item" data-act="my-content" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M15 3.5V7h3.5"/><path d="M9 12.5h6M9 16h4"/></svg>
            Мій контент
          </button>
          <div class="me-sep"></div>
          <button class="me-item me-quota" id="quota" type="button" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 2"/></svg>
            <span class="me-quota-body">
              <span class="quota-top">
                <span class="quota-label">Квота за тиждень</span>
                <span class="quota-nums"><b id="quota-used">—</b> / <span id="quota-limit">—</span></span>
              </span>
              <span class="quota-bar"><span class="quota-fill" id="quota-fill"></span></span>
            </span>
          </button>
          <div class="me-sep"></div>
          <div class="me-theme"><span>Тема</span><div class="theme-seg" id="theme-seg"></div></div>
          <div class="me-sep"></div>
          <button class="me-item" id="logout-btn" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5H19v15h-4.5M11 8l-4 4 4 4M7 12h9"/></svg>
            Вийти
          </button>
        </div>
      </div>
    </header>

    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <main id="view" class="view"></main>
      </div>
    </div>

    <!-- Телефон: головні напрямки під великим пальцем -->
    <nav class="tabbar" id="tabbar"></nav>
    <div class="side-scrim" id="side-scrim"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=59"></script>
</body>
</html>
